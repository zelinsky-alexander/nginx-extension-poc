name: build-poc

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nginx_version: ["1.28.0"]

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl libpcre2-dev zlib1g-dev libssl-dev

      - name: Build C history tools
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -O2 \
            lab/history_collector.c \
            -o /tmp/nginx-upstream-identity-history-collector
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -O2 \
            lab/history_sender.c \
            -o /tmp/nginx-upstream-identity-history-sender
          test -x /tmp/nginx-upstream-identity-history-collector
          test -x /tmp/nginx-upstream-identity-history-sender

      - name: Smoke test C history transport
        run: |
          set -euo pipefail
          socket=/tmp/nginx-upstream-identity-ci.sock
          history=/tmp/nginx-upstream-identity-ci.jsonl
          rm -f "$socket" "$history"

          /tmp/nginx-upstream-identity-history-collector --sync none "$socket" "$history" &
          collector_pid=$!
          trap 'kill "$collector_pid" 2>/dev/null || true; wait "$collector_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 50); do
            [ -S "$socket" ] && break
            sleep 0.1
          done
          test -S "$socket"
          test "$(stat -c %a "$socket")" = "600"

          payload='{"schema_version":1,"timestamp":1,"change":"first_seen","upstream":"ci","peer":"127.0.0.1:443","previous_cert_sha256":"","current_cert_sha256":"a","previous_spki_sha256":"","current_spki_sha256":"b"}'
          /tmp/nginx-upstream-identity-history-sender "$socket" "$payload"

          for _ in $(seq 1 50); do
            [ -s "$history" ] && break
            sleep 0.1
          done

          test "$(wc -l < "$history")" -eq 1
          grep -F '"change":"first_seen"' "$history"

      - name: Test collector SIGHUP reopen
        run: |
          set -euo pipefail
          socket=/tmp/nginx-upstream-identity-reopen.sock
          history=/tmp/nginx-upstream-identity-reopen.jsonl
          rotated=/tmp/nginx-upstream-identity-reopen.jsonl.1
          rm -f "$socket" "$history" "$rotated"

          /tmp/nginx-upstream-identity-history-collector --sync always "$socket" "$history" &
          collector_pid=$!
          trap 'kill "$collector_pid" 2>/dev/null || true; wait "$collector_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 50); do
            [ -S "$socket" ] && break
            sleep 0.1
          done
          test -S "$socket"

          payload1='{"schema_version":1,"timestamp":1,"change":"first_seen"}'
          /tmp/nginx-upstream-identity-history-sender "$socket" "$payload1"

          for _ in $(seq 1 50); do
            [ -s "$history" ] && break
            sleep 0.1
          done
          test "$(wc -l < "$history")" -eq 1

          mv "$history" "$rotated"
          : > "$history"
          kill -HUP "$collector_pid"
          sleep 0.2

          payload2='{"schema_version":1,"timestamp":2,"change":"public_key_changed"}'
          /tmp/nginx-upstream-identity-history-sender "$socket" "$payload2"

          for _ in $(seq 1 50); do
            [ -s "$history" ] && break
            sleep 0.1
          done

          test "$(wc -l < "$rotated")" -eq 1
          test "$(wc -l < "$history")" -eq 1
          grep -F '"change":"public_key_changed"' "$history"

      - name: Download NGINX source
        run: |
          curl -fLO "https://nginx.org/download/nginx-${{ matrix.nginx_version }}.tar.gz"
          tar xzf "nginx-${{ matrix.nginx_version }}.tar.gz"

      - name: Configure
        working-directory: nginx-${{ matrix.nginx_version }}
        run: |
          ./configure \
            --with-http_ssl_module \
            --with-compat \
            --add-dynamic-module="$GITHUB_WORKSPACE"

      - name: Build dynamic module
        working-directory: nginx-${{ matrix.nginx_version }}
        run: |
          make -j"$(nproc)" modules
          test -s objs/ngx_http_upstream_identity_module.so
